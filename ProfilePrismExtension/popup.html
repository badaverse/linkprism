<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      padding: 20px;
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, sans-serif;
      color: #222;
      text-align: center;
    }
    .icon { width: 48px; height: 48px; margin-bottom: 8px; }
    h2 { font-size: 15px; margin-bottom: 4px; }
    .desc { font-size: 12px; color: #666; margin-bottom: 12px; }

    .status-box {
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .status-box.connected { background: #e8f5e9; color: #2e7d32; }
    .status-box.disconnected { background: #fbe9e7; color: #c62828; }
    .profile-name { font-weight: 600; }

    .profile-select {
      text-align: left;
      margin-bottom: 12px;
    }
    .profile-select h3 {
      font-size: 12px;
      color: #666;
      margin-bottom: 6px;
    }
    .profile-btn {
      display: block;
      width: 100%;
      padding: 8px 12px;
      margin-bottom: 4px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fff;
      font: 12px -apple-system, BlinkMacSystemFont, sans-serif;
      color: #333;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s;
    }
    .profile-btn:hover { background: #f5f5f5; border-color: #bbb; }
    .profile-btn.selected {
      background: #e8f5e9;
      border-color: #2e7d32;
      color: #2e7d32;
      font-weight: 500;
    }
    .profile-btn .email { color: #999; font-size: 11px; }
    .profile-btn.selected .email { color: #66bb6a; }

    .links { display: flex; flex-direction: column; gap: 8px; }
    .links a {
      display: block;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      text-decoration: none;
      transition: opacity 0.15s;
    }
    .links a:hover { opacity: 0.85; }
    .links a.primary { background: #1a73e8; color: #fff; }
    .links a.secondary { background: #f1f3f4; color: #444; }

    .refresh-btn {
      display: block;
      width: 100%;
      padding: 8px 12px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fff;
      font: 12px -apple-system, BlinkMacSystemFont, sans-serif;
      color: #555;
      cursor: pointer;
      transition: all 0.15s;
    }
    .refresh-btn:hover { background: #f5f5f5; border-color: #bbb; }
    .refresh-btn:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <img class="icon" src="icons/icon48.png" alt="">
  <h2>ProfilePrism</h2>
  <p class="desc" data-i18n="popupDescription"></p>

  <div id="statusBox" class="status-box" style="display:none"></div>
  <div id="profileSelect" class="profile-select" style="display:none"></div>
  <button id="refreshBtn" class="refresh-btn" style="display:none" data-i18n="refreshRules"></button>

  <div class="links">
    <a class="primary" href="https://github.com/badaverse/ProfilePrism/releases/latest" target="_blank" data-i18n="downloadApp"></a>
    <a class="secondary" href="https://github.com/badaverse/ProfilePrism" target="_blank" data-i18n="viewOnGithub"></a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
